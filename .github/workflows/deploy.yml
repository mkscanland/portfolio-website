name: Deploy Vue App to S3

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --exact-timestamps

      - name: Fix Content-Type on S3 for common assets
        run: |
          set -euo pipefail
          find ./dist -type f -print0 | while IFS= read -r -d '' f; do
            key=${f#./dist/}
            ext="${f##*.}"
            ext_lower=$(echo "$ext" | tr '[:upper:]' '[:lower:]')
            case "$ext_lower" in
              txt) ct='text/plain; charset=utf-8' ;;
              html|htm) ct='text/html; charset=utf-8' ;;
              xhtml) ct='application/xhtml+xml' ;;
              css) ct='text/css; charset=utf-8' ;;
              js) ct='application/javascript' ;;
              xml) ct='application/xml' ;;
              json) ct='application/json' ;;
              jsonld) ct='application/ld+json' ;;
              gif) ct='image/gif' ;;
              jpeg|jpg) ct='image/jpeg' ;;
              png) ct='image/png' ;;
              svg) ct='image/svg+xml' ;;
              webp) ct='image/webp' ;;
              weba) ct='audio/webm' ;;
              webm) ct='video/webm' ;;
              3gp) ct='video/3gpp' ;;
              3g2) ct='video/3gpp2' ;;
              pdf) ct='application/pdf' ;;
              swf) ct='application/x-shockwave-flash' ;;
              atom) ct='application/atom+xml' ;;
              rss) ct='application/rss+xml' ;;
              ico) ct='image/vnd.microsoft.icon' ;;
              jar) ct='application/java-archive' ;;
              ttf) ct='font/ttf' ;;
              otf) ct='font/otf' ;;
              eot) ct='application/vnd.ms-fontobject' ;;
              woff) ct='font/woff' ;;
              woff2) ct='font/woff2' ;;
              *) ct='application/octet-stream' ;;
            esac
            echo "Updating $key -> Content-Type: $ct"
            aws s3 cp "$f" "s3://${{ secrets.S3_BUCKET }}/$key" --content-type "$ct" --metadata-directive REPLACE
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
