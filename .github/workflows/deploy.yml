name: Deploy Vue App to S3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Check lint
        run: npm run lint:check

  visual:
    name: Visual regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # A maintainer adds this label after reviewing an intentional visual change.
    continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change-approved') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      - name: Compare screenshots with the base branch
        run: npm run test:visual:compare -- "origin/${{ github.base_ref }}"

      - name: Check browser behavior
        run: npm run test:behavior

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --exact-timestamps

      - name: Fix Content-Type on S3 for problem assets
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.S3_BUCKET }}"
          find ./dist -type f -print0 | while IFS= read -r -d '' f; do
            key=${f#./dist/}
            ext="${f##*.}"
            ext_lower=$(echo "${ext}" | tr '[:upper:]' '[:lower:]')
            ct=''
            case "$ext_lower" in
              woff)    ct='application/font-woff' ;;
              woff2)   ct='application/font-woff2' ;;
              *)       ct='' ;;
            esac

            if [ -n "$ct" ]; then
              echo "Updating $key -> Content-Type: $ct"
              cache_control=$(aws s3api head-object --bucket "$BUCKET" --key "$key" --query 'CacheControl' --output text 2>/dev/null || echo "")
              cache_args=()
              if [ -n "$cache_control" ] && [ "$cache_control" != "None" ]; then
                cache_args+=(--cache-control "$cache_control")
              fi
              aws s3 cp "$f" "s3://$BUCKET/$key" --content-type "$ct" "${cache_args[@]}" --metadata-directive REPLACE
            else
              echo "Skipping $key (no mapped Content-Type)"
            fi
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
