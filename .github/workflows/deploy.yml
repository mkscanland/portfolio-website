name: Deploy Vue App to S3

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --exact-timestamps

      - name: Fix Content-Type on S3 for problem assets
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.S3_BUCKET }}"
          find ./dist -type f -print0 | while IFS= read -r -d '' f; do
            key=${f#./dist/}
            ext="${f##*.}"
            ext_lower=$(echo "${ext}" | tr '[:upper:]' '[:lower:]')
            ct=''
            case "$ext_lower" in
              woff)    ct='application/font-woff' ;;
              woff2)   ct='application/font-woff2' ;;
              *)       ct='' ;;
            esac

            if [ -n "$ct" ]; then
              echo "Updating $key -> Content-Type: $ct"
              # Preserve existing Cache-Control header where present
              cache_control=$(aws s3api head-object --bucket "$BUCKET" --key "$key" --query 'CacheControl' --output text 2>/dev/null || echo "")
              cache_args=()
              if [ -n "$cache_control" ] && [ "$cache_control" != "None" ]; then
                cache_args+=(--cache-control "$cache_control")
              fi
              aws s3 cp "$f" "s3://$BUCKET/$key" --content-type "$ct" "${cache_args[@]}" --metadata-directive REPLACE
            else
              echo "Skipping $key (no mapped Content-Type)"
            fi
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
